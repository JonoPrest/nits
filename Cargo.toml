[workspace]
resolver = "3"
members = [
    "crates/nits-protocol",
    "crates/nits-protocol-fixtures",
    "crates/nits-client-core-fixtures",
    "crates/nits-client-host",
    "crates/nits-review-core",
    "crates/nits-test-support",
    "crates/nitsd",
    "crates/nits-mcp",
    "crates/nits-cli",
    "crates/nits-config",
    "crates/nits-client-core",
    "crates/nits-client-tauri",
    "crates/nits-client-web",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/JonoPrest/nits"
homepage = "https://github.com/JonoPrest/nits"
authors = ["Jono Prest <jjprest@gmail.com>"]
keywords = ["code-review", "git", "diff", "review"]
categories = ["development-tools", "command-line-utilities"]
rust-version = "1.91"

[workspace.dependencies]
nits-protocol = { path = "crates/nits-protocol", version = "0.1.0" }
nits-protocol-fixtures = { path = "crates/nits-protocol-fixtures" }
nits-review-core = { path = "crates/nits-review-core", version = "0.1.0" }
nits-test-support = { path = "crates/nits-test-support" }
nitsd = { path = "crates/nitsd", version = "0.1.0" }
nits-mcp = { path = "crates/nits-mcp", version = "0.1.0" }
nits-config = { path = "crates/nits-config", version = "0.1.0" }
nits-client-core = { path = "crates/nits-client-core", version = "0.1.0" }
nits-client-core-fixtures = { path = "crates/nits-client-core-fixtures" }
nits-client-host = { path = "crates/nits-client-host", version = "0.1.0" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
ulid = { version = "1", default-features = false }
strum = { version = "0.27", features = ["derive"] }
thiserror = "2"
schemars = "1"
anyhow = "1"
proptest = "1"
insta = { version = "1", features = ["json"] }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "macros", "time", "signal", "process", "io-std"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
gethostname = "1"
notify = "8"

[workspace.lints.rust]
missing_debug_implementations = "deny"
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Wire enums legitimately vary in size; boxing them would hurt every constructor.
large_enum_variant = "allow"

# Exact executable identity is computed at startup, including in development.
# Keep SHA-256 compression optimized so debug symbol size does not turn each
# short CLI invocation or bounded candidate inspection into seconds of hashing.
[profile.dev.package.sha2]
opt-level = 3

[profile.test.package.sha2]
opt-level = 3
