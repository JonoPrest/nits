[package]
name = "nits-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
categories.workspace = true
keywords.workspace = true
authors.workspace = true
homepage.workspace = true
description = "MCP (Model Context Protocol) stdio server that proxies to a nitsd daemon"

[lib]
path = "src/lib.rs"

[dependencies]
nits-protocol = { workspace = true, features = ["schema"] }
schemars = { workspace = true }
nitsd = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
strum = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
gethostname = { workspace = true }
nits-config = { workspace = true, features = ["schema"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
nits-config = { path = "../nits-config" }
nits-review-core = { workspace = true }
nits-test-support = { workspace = true }
tempfile = { workspace = true }
tokio-util.workspace = true

[lints]
workspace = true
