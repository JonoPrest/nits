[package]
name = "nits-protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
categories.workspace = true
keywords.workspace = true
authors.workspace = true
homepage.workspace = true
description = "Wire types for Nits: domain model, events, render model and RPC. wasm-safe."

[dependencies]
serde = { workspace = true }
semver = "1"
url = "2.5"
ulid = { workspace = true }
strum = { workspace = true }
thiserror = { workspace = true }
schemars = { workspace = true, optional = true }

[features]
## Dev-only real older serializer build for installed-upgrade process tests.
upgrade-fixture-previous-protocol = []
## JSON Schema derivation for every wire type (`schemars`). Off by default so
## wasm and daemon builds stay lean; adapters that advertise schemas turn it on.
schema = ["dep:schemars"]

[dev-dependencies]
proptest = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
