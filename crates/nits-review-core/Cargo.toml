[package]
name = "nits-review-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
categories.workspace = true
keywords.workspace = true
authors.workspace = true
homepage.workspace = true
description = "Git access, diffing, anchoring, event store and review logic for Nits. Daemon-only."

[dependencies]
nits-protocol = { workspace = true }
gix = { version = "0.87", default-features = false, features = ["revision", "sha1", "parallel"] }
imara-diff = "0.2"
redb = "4"
syntect = { version = "5", default-features = false, features = ["parsing", "default-syntaxes", "regex-fancy", "dump-load"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tempfile = { workspace = true }
rustix = { version = "1", features = ["fs"] }

[dev-dependencies]
nits-test-support = { workspace = true }
nits-protocol-fixtures = { workspace = true }
insta = { workspace = true }
proptest = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true

[[bench]]
name = "triggers"
harness = false
