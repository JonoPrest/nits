[package]
name = "nits-client-tauri"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Desktop wrapper: tauri::Builder around nits-client-host. Three commands (dispatch/key/attach) in, `view` events of ViewPatch arrays out."

[[bin]]
name = "nits-desktop"
path = "src/main.rs"

[dependencies]
nits-client-core = { workspace = true }
nits-client-host = { workspace = true }
nits-protocol = { workspace = true }
nits-config = { workspace = true }
nitsd = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { version = "2", features = [] }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
gethostname = { workspace = true }
clap = { workspace = true }
fastrand = "2.5.0"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lints]
workspace = true
